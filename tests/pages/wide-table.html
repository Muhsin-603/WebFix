<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wide Table Test</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; }
    table { width: 1300px; border-collapse: collapse; }
    th, td { border: 1px solid #cbd5e1; padding: 10px; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <h1>Wide Data Table Without Overflow Wrapper</h1>
  <table>
    <thead>
      <tr>
        <th>Col 1</th><th>Col 2</th><th>Col 3</th><th>Col 4</th><th>Col 5</th>
        <th>Col 6</th><th>Col 7</th><th>Col 8</th><th>Col 9</th><th>Col 10</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Val 1</td><td>Val 2</td><td>Val 3</td><td>Val 4</td><td>Val 5</td>
        <td>Val 6</td><td>Val 7</td><td>Val 8</td><td>Val 9</td><td>Val 10</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
