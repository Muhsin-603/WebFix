<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fixed-Width Container Test</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; }
    .fixed-wrapper {
      width: 1250px;
      min-width: 1200px;
      padding: 24px;
      background: #0284c7;
      color: white;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="fixed-wrapper">
    <h1>Fixed 1250px Container</h1>
    <p>Container with rigid CSS width and min-width exceeding mobile and tablet viewports.</p>
  </div>
</body>
</html>
