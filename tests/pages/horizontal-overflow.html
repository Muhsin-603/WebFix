<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizontal Overflow Test</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; }
    .overflowing-banner {
      width: 1400px;
      padding: 30px;
      background: #7c3aed;

</html>
