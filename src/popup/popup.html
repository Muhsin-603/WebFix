<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebFix — Responsive Layout Fixer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="webfix-popup-card">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
            <path d="M7 8h10"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>WebFix <span class="version-tag">v0.1</span></h1>
          <span class="status-subtitle" id="connection-status">Ready</span>
        </div>
      </div>
      <div class="header-actions">
        <a href="../settings/settings.html" target="_blank" class="icon-btn" title="Settings" id="open-settings-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </a>
      </div>
    </header>

    <!-- Score & Quick Stats Pill Bar -->
    <section class="stats-bar" id="stats-bar" style="display: none;">
      <div class="score-card">
        <span class="stat-label">Responsive Score</span>
        <div class="score-display">
          <span class="score-val" id="score-val">--</span>
          <span class="score-delta" id="score-delta"></span>
        </div>
      </div>
      <div class="vp-card">
        <span class="stat-label">Viewport</span>
        <span class="stat-value" id="vp-dimensions">-- &times; -- px</span>
      </div>
      <div class="prob-card">
        <span class="stat-label">Issues</span>
        <span class="stat-value highlight-warn" id="problem-count">0</span>
      </div>
    </section>

    <!-- Primary Action: Analyze -->
    <div class="action-top">
      <button id="analyze-btn" class="btn btn-primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Analyze Page</span>
      </button>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🔍</div>
      <p class="empty-title">Page not yet analyzed</p>
      <p class="empty-desc">Click "Analyze Page" to scan for horizontal overflow, fixed-width blocks, oversized images, and misplaced elements.</p>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" id="error-banner" style="display: none;">
      <span id="error-message"></span>
    </div>

    <!-- Fixes List View -->
    <section class="fixes-section" id="fixes-section" style="display: none;">
      <div class="section-header">
        <span class="section-title">Detected Issues &amp; Proposed Fixes</span>
        <button id="toggle-select-all" class="text-link-btn">Select All</button>
      </div>

      <div class="fixes-list" id="fixes-list">
        <!-- Injected via popup.ts -->
      </div>

      <div class="button-group">
        <button id="apply-btn" class="btn btn-accent">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Apply Selected Fixes</span>
        </button>
        <button id="restore-btn" class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          <span>Restore Original</span>
        </button>
      </div>
    </section>

    <!-- Diagnostics Log Accordion -->
    <section class="diagnostics-section" id="diagnostics-section" style="display: none;">
      <button class="accordion-header" id="diagnostics-toggle">
        <div class="accordion-title-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>Visual Change Log (<span id="log-count">0</span>)</span>
        </div>
        <span class="chevron" id="diagnostics-chevron">&#9662;</span>
      </button>
      <div class="accordion-content" id="diagnostics-content" style="display: none;">
        <div class="log-entries" id="log-entries">
          <!-- Injected via popup.ts -->
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
